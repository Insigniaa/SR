<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Radio | Live Radio & Hits</title>
    <meta name="description"
        content="Luister live naar Super Radio - De ultieme hitradio met non-stop muziek en entertainment">
    <link rel="manifest" href="manifest.json">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- Loading Screen -->
    <div id="loading-screen" class="loading-screen">
        <div class="loading-content">
            <div class="loading-logo">
                <div class="radio-tower">
                    <div class="tower-base"></div>
                    <div class="tower-mast"></div>
                    <div class="radio-waves-loading">
                        <div class="wave wave-1"></div>
                        <div class="wave wave-2"></div>
                        <div class="wave wave-3"></div>
                    </div>
                </div>
                <h1 class="loading-title">Super Radio</h1>
                <p class="loading-subtitle">Live Radio & Hits</p>
            </div>
            <div class="loading-progress">
                <div class="progress-bar">
                    <div class="progress-fill"></div>
                </div>
                <div class="loading-text">Tuning in...</div>
            </div>
        </div>
    </div>

    <!-- Glass Background -->
    <div class="glass-background">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="app-wrapper">
        <!-- Floating Header -->
        <header class="glass-header">
            <div class="container">
                <div class="logo">
                    <i class="fas fa-broadcast-tower logo-icon"></i>
                    <span class="logo-text">SUPER<span class="highlight">RADIO</span></span>
                </div>
                <nav class="desktop-nav">
                    <ul>
                        <li><a href="#" class="nav-link active">Home</a></li>
                        <li><a href="#news" class="nav-link">Nieuws</a></li>
                        <li><a href="#schedule" class="nav-link">Programma's</a></li>
                    </ul>
                </nav>
                <div class="header-actions">
                    <button class="listen-live-btn" aria-label="Listen Live">
                        <span class="icon-container"><i class="fas fa-play"></i></span>
                        <span class="btn-text">LIVE</span>
                    </button>
                    <button class="mobile-menu-btn" aria-label="Open Menu">
                        <i class="fas fa-bars"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main>
            <!-- Hero / Player Section -->
            <section class="hero-section">
                <div class="hero-container">
                    <div class="main-artwork-container">
                        <div class="canvas-container">
                            <canvas id="visualizer-canvas"></canvas>
                        </div>
                        <div class="artwork-wrapper">
                            <img src="" alt="Album Art" class="main-artwork track-img">
                            <div class="artwork-glow"></div>
                        </div>
                        <div class="live-indicator">
                            <span class="pulse-dot"></span>
                            <span class="live-text">LIVE ON AIR</span>
                            <span class="listener-count-badge"><i class="fas fa-user"></i> <span
                                    class="count">0</span></span>
                        </div>
                    </div>

                    <div class="track-details">
                        <h1 class="hero-title track-title">Loading...</h1>
                        <p class="hero-artist track-artist">Loading...</p>

                        <div class="hero-controls">
                            <button class="hero-play-btn play-pause-btn">
                                <i class="fas fa-play"></i>
                            </button>
                            <div class="volume-container">
                                <i class="fas fa-volume-up"></i>
                                <input type="range" class="volume-slider" min="0" max="100" value="80">
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Recent Tracks -->
            <section class="content-section">
                <div class="container">
                    <div class="section-header">
                        <h2><i class="fas fa-history"></i> Just Played</h2>
                    </div>
                    <div class="tracks-grid">
                        <!-- Tracks injected here -->
                    </div>
                </div>
            </section>

            <!-- Schedule -->
            <section id="schedule" class="content-section">
                <div class="container">
                    <div class="section-header">
                        <h2><i class="fas fa-calendar-alt"></i> Schedule</h2>
                    </div>
                    <div class="schedule-container">
                        <!-- Schedule injected here -->
                    </div>
                </div>
            </section>

            <!-- News -->
            <section id="news" class="content-section">
                <div class="container">
                    <div class="section-header">
                        <h2><i class="fas fa-newspaper"></i> News</h2>
                    </div>
                    <div class="news-grid">
                        <!-- News injected here -->
                    </div>
                </div>
            </section>
        </main>

        <!-- Mobile Menu Overlay -->
        <div class="mobile-menu-content">
            <nav>
                <ul>
                    <li><a href="#" class="active">Home</a></li>
                    <li><a href="#news">Nieuws</a></li>
                    <li><a href="#schedule">Programma's</a></li>
                </ul>
            </nav>
        </div>
    </div>

    <!-- Sticky Bottom Player -->
    <div id="sticky-player" class="sticky-player hidden">
        <div class="sticky-container">
            <div class="sticky-track-info">
                <img src="" alt="Track Art" class="sticky-art track-img">
                <div class="sticky-text">
                    <div class="sticky-title track-title">Loading...</div>
                    <div class="sticky-artist track-artist">Loading...</div>
                </div>
            </div>

            <div class="sticky-controls">
                <button class="sticky-play-btn play-pause-btn">
                    <i class="fas fa-play"></i>
                </button>
            </div>

            <div class="sticky-volume">
                <i class="fas fa-volume-up"></i>
                <input type="range" class="volume-slider" min="0" max="100" value="80">
            </div>
        </div>
    </div>

    <!-- Notification Container -->
    <div class="notification-container"></div>

    <script type="module" src="js/main.js"></script>
</body>

</html>
