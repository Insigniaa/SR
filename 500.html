<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Er ging iets mis bij ons — Super Radio</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#0B0A09" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#FBF8F4" media="(prefers-color-scheme: light)">
    <link rel="icon" href="images/favicon.ico" sizes="48x48">
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" href="styles.css">
    <style>
        .status {
            min-height: 100svh;
            display: grid;
            place-items: center;
            padding: 2rem var(--gutter);
            text-align: center;
        }

        .status__inner {
            display: grid;
            justify-items: center;
            gap: 1.15rem;
            max-width: 30rem;
        }

        .status__mark {
            display: grid;
            place-items: center;
            width: 68px;
            height: 68px;
            border-radius: 22px;
            color: #fff;
            background: linear-gradient(145deg, var(--brand-soft), var(--brand-deep));
            box-shadow: 0 18px 40px -14px color-mix(in srgb, var(--brand) 70%, transparent);
        }

        .status__mark svg {
            width: 34px;
            height: 34px;
        }

        .status__code {
            font-family: var(--mono);
            font-size: .78rem;
            letter-spacing: .18em;
            text-transform: uppercase;
            color: var(--brand);
        }

        .status__title {
            font-size: clamp(1.9rem, 6vw, 3rem);
            font-weight: 900;
            letter-spacing: -.04em;
        }

        .status__text {
            color: var(--text-2);
        }

        .status__actions {
            display: flex;
            flex-wrap: wrap;
            gap: .7rem;
            justify-content: center;
            margin-top: .5rem;
        }

        .status__btn {
            padding: .8rem 1.5rem;
            border-radius: 99px;
            font-weight: 700;
            font-size: .92rem;
            color: #fff;
            background: linear-gradient(135deg, var(--brand-soft), var(--brand-deep));
            box-shadow: 0 10px 26px -12px color-mix(in srgb, var(--brand) 85%, transparent);
        }

        .status__btn--ghost {
            color: var(--text);
            background: var(--surface);
            border: 1px solid var(--line-2);
            box-shadow: none;
        }
    </style>
</head>

<body>
    <svg style="position:absolute;width:0;height:0" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
        <symbol id="i-signal" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="2.6" fill="currentColor" />
            <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <path d="M7.4 7.4a6.5 6.5 0 0 0 0 9.2M16.6 16.6a6.5 6.5 0 0 0 0-9.2" />
                <path d="M4.2 4.2a11 11 0 0 0 0 15.6M19.8 19.8a11 11 0 0 0 0-15.6" />
            </g>
        </symbol>
    </svg>

    <main class="status">
        <div class="status__inner">
            <span class="status__mark"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-signal" /></svg></span>
            <p class="status__code">Fout 500</p>
            <h1 class="status__title">Er ging iets mis bij ons</h1>
            <p class="status__text">Onze server had even een storing. Probeer het over een paar minuten opnieuw.</p>
            <div class="status__actions">
                <a class="status__btn" href="/">Naar de radio</a>
                <button class="status__btn status__btn--ghost" type="button" id="retry">Opnieuw proberen</button>
            </div>
        </div>
    </main>

    <script src="js/status.js"></script>
</body>

</html>
